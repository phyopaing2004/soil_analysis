<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFLite Model Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: block;
            margin-top: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>TFLite Model Inference</h2>
    
    <div class="form-group">
        <label for="imageInput">Upload Image for Testing:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button onclick="uploadAndPredict()">Predict</button>

    <h3>Result:</h3>
    <pre id="result">Waiting for input...</pre>
</div>

<script>
async function uploadAndPredict() {
    const fileInput = document.getElementById('imageInput');
    const resultElement = document.getElementById('result');

    if (fileInput.files.length === 0) {
        alert('Please select an image file first.');
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    resultElement.textContent = "Processing...";

    try {
        const response = await fetch('/predict', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();
        resultElement.textContent = JSON.stringify(data, null, 2);
    } catch (error) {
        resultElement.textContent = "Error during prediction: " + error.message;
    }
}
</script>

</body>
</html>
