<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Classification - TFLite Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            display: inline-block;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            margin: 10px;
            padding: 10px;
        }
        #result {
            font-weight: bold;
            color: #2b7a78;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Loam Soil vs Sandy Soil Classifier</h2>
        <p>မြေဆီလွှာ ဓာတ်ပုံ ပေးပို့၍ စမ်းသပ်ပါ</p>
        
        <input type="file" id="imageInput" accept="image/*">
        <br>
        <button onclick="uploadImage()">Predict</button>

        <h3>Result: <span id="result">-</span></h3>
    </div>

    <script>
        // -------------------------------------------------------------
        // ဒီနေရာမှာ Render က ရလာတဲ့ Backend Live URL ကို ပြောင်းပေးပါ
        // -------------------------------------------------------------
	// သင့် Render Live URL အမှန်ကို ထည့်ပါ (အဆုံးမှာ / မပါရပါ)
	const RENDER_BACKEND_URL = "https://soil-analysis-1-dddh.onrender.com";

        async function uploadImage() {
    const input = document.getElementById('imageInput');
    const resultElement = document.getElementById('result');

    if (input.files.length === 0) {
        alert("ကျေးဇူးပြု၍ မြေဆီလွှာ ပုံတစ်ပုံ ရွေးပေးပါ!");
        return;
    }

    resultElement.innerText = "Analyzing...";

    const formData = new FormData();
    // 🔴 Key Name ကို 'file' မှ 'image' သို့ ပြောင်းပါ (Flask request.files['image'] နဲ့ တူစေရန်)
    formData.append('image', input.files[0]);

    try {
        const response = await fetch(`${RENDER_BACKEND_URL}/predict`, {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            throw new Error(`Server Error: ${response.status}`);
        }

        const data = await response.json();
        
        if (data.error) {
            resultElement.innerText = "Error: " + data.error;
        } else {
            // 🔴 Flask က 'class' ဆိုတဲ့ key နဲ့ ပြန်ပေးထားတာမို့ data.class ကို သုံးရပါမည်
            // Flask ရဲ့ confidence ထဲမှာ % ပါပြီးသားဖြစ်လို့ % ထပ်ထည့်စရာမလိုပါ။
            resultElement.innerText = `${data.class} (Confidence: ${data.confidence})`;
        }
    } catch (error) {
        console.error("Error:", error);
        resultElement.innerText = "Connection Failed! Render Server ကို စစ်ဆေးပါ။";
    }
}
    </script>
</body>
</html>
